networks:
  soas-net:
    external: true   # koristimo već kreiranu mrežu

services:
  naming-server:
    image: isidora/naming-server:latest
    container_name: naming-server
    ports:
      - "8761:8761"
    networks: [soas-net]

  users-service:
    image: isidora/users-service:latest
    container_name: users-service
    ports:
      - "8770:8770"
    environment:
      # eureka.client.service-url.defaultZone
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
      # (opciono) ako imaš profile ili dodatne spring varijable, dodaj ovde
    networks: [soas-net]

  bank-account:
    image: isidora/bank-account:latest
    container_name: bank-account
    ports:
      - "8200:8200"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  crypto-wallet:
    image: isidora/crypto-wallet:latest
    container_name: crypto-wallet
    ports:
      - "8300:8300"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  currency-exchange:
    image: isidora/currency-exchange:latest
    container_name: currency-exchange
    ports:
      - "8000:8000"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  currency-conversion:
    image: isidora/currency-conversion:latest
    container_name: currency-conversion
    ports:
      - "8100:8100"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  crypto-exchange:
    image: isidora/crypto-exchange:latest
    container_name: crypto-exchange
    ports:
      - "8400:8400"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  crypto-conversion:
    image: isidora/crypto-conversion:latest
    container_name: crypto-conversion
    ports:
      - "8500:8500"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  trade-service:
    image: isidora/trade-service:latest
    container_name: trade-service
    ports:
      - "8600:8600"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
    networks: [soas-net]

  api-gateway:
    image: isidora/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://naming-server:8761/eureka/"
      # Ako ti treba Actuator spolja:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: "ALWAYS"
    depends_on: [users-service]
    networks: [soas-net]

